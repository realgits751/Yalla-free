<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yalla Learn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; padding: 25px 15px; }
    
    .lang-toggle { display: flex; background: #1e293b; border-radius: 12px; padding: 4px; margin-top: 10px; }
    .toggle-btn { background: none; border: none; color: #94a3b8; font-size: 15px; font-weight: bold; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    .toggle-btn.active { background: #3b82f6; color: #fff; }

    .card { background: #1e293b; width: 90%; max-width: 360px; border-radius: 24px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .category { color: #94a3b8; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 25px; }
    .native-script { font-size: 42px; font-weight: 700; margin-bottom: 10px; direction: rtl; }
    .phonetic { color: #38bdf8; font-size: 22px; font-style: italic; margin-bottom: 20px; }
    .divider { height: 1px; background: #334155; margin: 15px 0 20px; }
    .translation { font-size: 20px; font-weight: 600; color: #f8fafc; margin-bottom: 30px; }

    .speaker-btn { background: #0284c7; color: #fff; border: none; font-size: 16px; font-weight: bold; padding: 14px 28px; border-radius: 50px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .speaker-btn:active { transform: scale(0.97); }

    .next-btn { width: 90%; max-width: 360px; background: #10b981; color: #fff; border: none; font-size: 18px; font-weight: bold; padding: 16px; border-radius: 16px; cursor: pointer; margin-bottom: 10px; }
    .next-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <!-- Language Switcher -->
  <div class="lang-toggle">
    <button id="btnHebrew" class="toggle-btn active" onclick="setLanguage('hebrew')">Hebrew (עברית)</button>
    <button id="btnArabic" class="toggle-btn" onclick="setLanguage('arabic')">Arabic (عربي)</button>
  </div>

  <!-- Flashcard -->
  <div class="card">
    <div id="cardCat" class="category">STREET SLANG</div>
    <div id="cardScript" class="native-script">סבבה</div>
    <div id="cardPhonetic" class="phonetic">Sababa</div>
    <div class="divider"></div>
    <div id="cardTrans" class="translation">All good / Great</div>
    <button class="speaker-btn" onclick="playAudio()">🔊 Listen</button>
  </div>

  <!-- Bottom Next Button -->
  <button class="next-btn" onclick="nextCard()">Next Phrase →</button>

  <script>
    const data = [
      { cat: "Everyday Slang", en: "Let's go / Hurry up", he: "יאללה", heP: "Yalla", ar: "يلا", arP: "Yalla" },
      { cat: "Everyday Slang", en: "All good / Great", he: "סבבה", heP: "Sababa", ar: "صبابة", arP: "Sababa" },
      { cat: "Greetings", en: "How are you?", he: "מה נשמע?", heP: "Ma nishma?", ar: "كيفك؟", arP: "Kifak?" },
      { cat: "Food & Market", en: "How much does it cost?", he: "כמה זה עולה?", heP: "Kama ze oleh?", ar: "قديش هذا؟", arP: "Gaddeish hada?" },
      { cat: "Courtesy", en: "Thank you", he: "תודה", heP: "Toda", ar: "شكراً", arP: "Shukran" },
      { cat: "Courtesy", en: "Please / Welcome", he: "בבקשה", heP: "Bevakasha", ar: "تفضل", arP: "Tfaddal" },
      { cat: "Direction", en: "Where is...?", he: "איפה...?", heP: "Eifo...?", ar: "وين...?", arP: "Wein...?" }
    ];

    let currentIdx = 0;
    let currentLang = 'hebrew';

    function renderCard() {
      const item = data[currentIdx];
      document.getElementById('cardCat').innerText = item.cat;
      document.getElementById('cardTrans').innerText = item.en;
      if (currentLang === 'hebrew') {
        document.getElementById('cardScript').innerText = item.he;
        document.getElementById('cardPhonetic').innerText = item.heP;
      } else {
        document.getElementById('cardScript').innerText = item.ar;
        document.getElementById('cardPhonetic').innerText = item.arP;
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btnHebrew').classList.toggle('active', lang === 'hebrew');
      document.getElementById('btnArabic').classList.toggle('active', lang === 'arabic');
      renderCard();
    }

    function nextCard() {
      currentIdx = (currentIdx + 1) % data.length;
      renderCard();
    }

    function playAudio() {
      const item = data[currentIdx];
      const text = currentLang === 'hebrew' ? item.he : item.ar;
      const langCode = currentLang === 'hebrew' ? 'he-IL' : 'ar-SA';
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode;
      window.speechSynthesis.speak(utterance);
    }

    renderCard();
  </script>
</body>
</html>
